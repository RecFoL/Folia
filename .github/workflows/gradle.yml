name: Build Folia 1.21.11

on:
  push:
    branches: [ "ver/26.1.x" ]
  pull_request:
    branches: [ "ver/26.1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive # Важно для подгрузки зависимостей ядра

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21' # Сменили с 17 на 21, т.к. 1.21.11 не соберется на старой Java
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Folia
      run: |
        chmod +x gradlew
        ./gradlew applyPatches
        ./gradlew createReobfBundledJar --no-configuration-cache -x test

    - name: Upload Server Jar
      uses: actions/upload-artifact@v4
      with:
        name: folia-1.21.11-server
        path: |
          build/libs/*.jar
          folia-server/build/libs/*.jar
