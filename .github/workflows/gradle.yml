name: Build Folia 1.21.11

on:
  push:
    branches: [ "ver/26.1.x" ]
  pull_request:
    branches: [ "ver/26.1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Configure Git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Build Folia Server
      run: |
        chmod +x gradlew
        # 1. Применяем патчи Folia к исходникам Minecraft
        ./gradlew applyAllPatches --no-configuration-cache
        
        # 2. Собираем проект. Команда build создаст все необходимые JAR файлы.
        # Мы используем флаг -x test, чтобы не тратить время на проверку тестов.
        ./gradlew build --no-configuration-cache -x test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: folia-1.21.11-server
        # Этот блок ищет JAR-файлы во всех возможных папках, где они могут появиться
        path: |
          Folia-Server/build/libs/*.jar
          folia-server/build/libs/*.jar
          build/libs/*.jar
        # Если файлы не будут найдены, сборка выдаст ошибку, и мы узнаем об этом
        if-no-files-found: error
