name: Build Folia 1.21.11

on:
  push:
    branches: [ "ver/26.1.x" ]
  pull_request:
    branches: [ "ver/26.1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Configure Git
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"

    - name: Build Folia Server
      run: |
        chmod +x gradlew
        # Сначала обязательно применяем патчи
        ./gradlew applyAllPatches --no-configuration-cache
        # Затем запускаем общую сборку. 
        # Это самый надежный способ, если точное имя задачи неизвестно.
        ./gradlew build --no-configuration-cache -x test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: folia-1.21.11-server
        # Здесь мы ищем готовый JAR во всех подпапках сборки
        path: "**/build/libs/*.jar"
