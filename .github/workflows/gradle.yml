name: Build Folia 1.21.11

on:
  push:
    branches: [ "ver/26.1.x" ]
  pull_request:
    branches: [ "ver/26.1.x" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Folia Server
      run: |
        chmod +x gradlew
        # Применяем все патчи (API и Server)
        ./gradlew applyAllPatches --no-configuration-cache
        # Собираем готовый JAR, пропуская тесты и кэш конфигурации
        ./gradlew :folia-server:createReobfBundledJar --no-configuration-cache -x test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: folia-1.21.11-server
        path: folia-server/build/libs/*.jar
